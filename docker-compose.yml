version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    # Load environment variables from the root .env file
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    # No volume mount needed — database is on AWS RDS

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  frontend:
    build:
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        - VITE_RAZORPAY_KEY_ID=${VITE_RAZORPAY_KEY_ID}
    ports:
      - "80:80" # Exposed on port 80 for default web access
    depends_on:
      - backend
